# CIC-IDS2017 — MachineLearningCVE CSV dosyaları
# https://www.unb.ca/cic/datasets/ids-2017.html

title = "CIC-IDS2017"
label_column = "Label"

[source]
type = "kaggle"                       # "kaggle" (ref) ya da "url" (url = "https://...zip")
ref = "chethuhn/network-intrusion-dataset"
page = "https://www.kaggle.com/datasets/chethuhn/network-intrusion-dataset"

# Etiketler eşlenmeden önce uygulanan düzeltmeler.
# "Web Attack – XSS" içindeki tire dağıtıma göre \x96 (cp1252) ya da � (�) olarak bozuk gelir.
[label_normalize]
replace = [["�", "-"], ["\u0096", "-"]]

# Dosya adı → segment (gün/oturum). bytes ve sha256 isteğe bağlıdır; verilirse indirme doğrulanır.
